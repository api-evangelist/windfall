aid: windfall
name: Windfall
description: >-
  Windfall is an AI-powered people intelligence platform that helps go-to-market
  teams personalize workflows with wealth and career data, serving 1,500+
  organizations across finance, retail, education, healthcare, and nonprofits.
  The Windfall API delivers enriched household and career data for a single
  person record in real time — submit basic PII and receive JSON in one HTTPS
  request. One operation (enrichRecord) returns up to 32 documented household
  fields (net worth and its confidence bounds, property, life events,
  philanthropy, political giving, financial signals) and 26 career fields (job
  title and level, job-change signals, employer firmographics, LinkedIn URL),
  with availability set by the customer's plan. US coverage only; the database
  is rebuilt weekly; rate limited to 5 requests/second; and a non-billed sandbox
  with 15 deterministic fictitious personas and a header-driven error simulator
  mirrors production for integration testing. Access is contractual — tokens are
  issued by Windfall and API credits were bundled into existing subscriptions
  when the API opened to all customers and partners in May 2026.
