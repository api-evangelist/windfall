  description: >-
    Submit a person record (name, addresses, emails, phones, company) and
    receive Windfall's enriched household and career data in real time. US
    coverage only. Returns HTTP 200 with household_matched / career_matched
    false when no match is found — a no-match is not an error.
  source_operation: openapi/_original/windfall-openapi-original.json#enrichRecord
  input_schema_ref: openapi/_original/windfall-openapi-original.json#/components/schemas/EnrichmentRequest
  output_schema_ref: openapi/_original/windfall-openapi-original.json#/components/schemas/EnrichmentResponse
  consequence: read
  note: >-
    The request body carries third-party PII and the response carries inferred
    wealth and political-giving attributes about a natural person. Any agent
    binding should treat this as regulated data movement (Windfall is a
    registered California data broker) and gate it accordingly — see
    agentic-access/windfall-agentic-access.yml.
