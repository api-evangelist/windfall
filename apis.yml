x-pointers-deliberately-absent:
  note: >-
    Recorded so a later round does not re-open these. Each was probed on
    2026-08-14 and is genuinely not published by Windfall; wiring the pointer
    would assert a surface the provider does not serve.
  absent:
  - {type: SDKs, reason: 'No first-party client library in any registry — packages/windfall-packages.yml, package_count 0.'}
  - {type: Idempotency, reason: 'No Idempotency-Key header or equivalent is documented — conventions/windfall-conventions.yml.'}
  - {type: StatusPage, reason: 'status.windfall.com and status.windfalldata.com both 404.'}
  - {type: Deprecation, reason: No deprecation policy and no RFC 8594 Sunset/Deprecation headers.}
  - {type: ChangeLog, reason: 'No dated changelog or release notes; /changelog 404s on both hosts.'}
  - {type: Security, reason: 'No vulnerability disclosure program, no security.txt on any host, no bug bounty.'}
  - {type: WellKnown, reason: 'Every /.well-known path 404s (or 401s behind the API gateway) on all four hosts — well-known/windfall-well-known.yml.'}
  - {type: AgentCard, reason: 'No A2A agent card at /.well-known/agent-card.json or /.well-known/agent.json on any host.'}
  - {type: AsyncAPI, reason: No event, streaming or webhook surface exists — the API is a single synchronous request/response operation.}
  - {type: Webhooks, reason: No webhook catalog is documented anywhere in the nine-page reference.}
  - {type: OAuthScopes, reason: No OAuth 2.0 surface; authentication is a single static header token.}
  - {type: Pricing, reason: 'https://www.windfall.com/pricing 404s and the 146-URL sitemap contains no pricing route.'}
  - {type: SignUp, reason: No self-service signup — API tokens are issued by Windfall against a purchase order.}
  - {type: Roadmap, reason: No public roadmap.}
  - {type: CLI, reason: No first-party command-line tool.}
  - {type: Protobuf, reason: No gRPC or protobuf surface.}
  - {type: ToolCrosswalk, reason: 'No MCP server and no GraphQL surface to crosswalk against the OpenAPI — mcp/windfall-mcp.yml deployment.mode is none.'}
