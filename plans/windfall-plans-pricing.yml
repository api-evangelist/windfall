    by your purchase order". Both the quota and the refresh cadence are rendered
    on that page literally as "Per your purchase order". No dollar figure,
    per-record rate, or credit pack price is published anywhere.
  bundled_entitlement:
    announced: '2026-05-04'
    source: https://www.windfall.com/blog/powering-real-time-ai-native-workflows-opening-the-windfall-api-to-all-customers-and-partners
    note: >-
      In May 2026 Windfall opened the API to all existing customers and partners
      at no additional cost, with "a limited number of monthly credits based on
      their existing Windfall subscription". So API access is an entitlement
      attached to an existing (unpriced) platform subscription rather than a
      product with its own price list. Access is provisioned by Windfall — the
      documented path to more quota is "Contact your Windfall account
      representative", not a checkout.
  sandbox:
