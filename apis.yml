aid: windfall
name: Windfall
description: >-
  Windfall is an AI-powered people intelligence platform that helps go-to-market
  teams personalize workflows with wealth and career data, serving 1,500+
  organizations across finance, retail, education, healthcare, and nonprofits.
  The Windfall API delivers enriched household (net worth, Windfall ID,
  confidence) and career (LinkedIn URL, job title, confidence) data for a single
  person record in real time — submit basic PII and receive JSON in one HTTPS
  request. US coverage only; data refreshed weekly; rate limited to 5
  requests/second; and a non-billed sandbox with deterministic fictitious
  personas mirrors production for integration testing.
