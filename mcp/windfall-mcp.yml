notes: >-
  Windfall ships NO MCP server — not hosted, not stdio. Re-searched 2026-08-14
  across npm (no @windfall/* or windfall-mcp package), PyPI, the WindfallData
  GitHub organization (5 public repos, none an MCP server), the docs site (9
  pages, no MCP page), and public MCP registries. https://www.windfall.com/mcp
  returns 404 and there is no /.well-known/ai-plugin.json or agent card on any
  host.

  This is a notable gap rather than an ordinary absence: Windfall's own May 2026
  API announcement names MCP explicitly — "the emergence of MCP (Model Context
  Protocol) as a standard for connecting structured data to AI agents" — and
  positions the REST API as the way "product teams building AI agents or
  MCP-connected workflows" reach Windfall data. The company frames MCP as the
  demand driver and leaves the customer to build the server.

  The tool below is a DERIVED candidate mapped one-to-one from the single
  OpenAPI operation, to seed such a server. It is not a Windfall product and no
  endpoint is asserted. Auth is an org-issued API token in the X-WF-Auth-Token
  header; a sandbox_-prefixed token targets the non-billed sandbox endpoint,
  which is the right target for tool development because it is deterministic and
  consumes no credits.
